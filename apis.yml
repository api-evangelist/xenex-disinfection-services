name: Xenex Disinfection Services
description: Xenex Disinfection Services is a San Antonio, Texas-based medical technology
  company founded in 2008 by Johns Hopkins-trained epidemiologists Dr. Mark Stibich
  and Dr. Julie Stachowiak. Its LightStrike+ pulsed-xenon UV robot is the first FDA-authorized
  whole-room microbial reduction device, used by hospitals to destroy pathogens like
  C. difficile on surfaces; the portfolio also includes the LightStrike6 robot, the
  Deactivate handheld LED unit, and the TrackMate digital cleaning-event tracking
  system with a client portal at dms.xenex.com. Added to the API Evangelist network
  as a Battery Ventures portfolio company; enrichment probing found no public developer
  API, SDK, or developer portal, but the company does publish an llms.txt company
  profile on its website.
